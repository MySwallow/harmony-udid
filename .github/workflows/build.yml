name: Build Multi-Platform

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - '.github/workflows/build.yml'
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            hdc_name: hdc.exe
            sep: ';'
          - os: macos-latest        # Apple Silicon runner, output Universal2 .app
            label: macos-universal
            hdc_name: hdc
            sep: ':'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # --------- Windows: standard setup-ohos-sdk ---------
      - name: Setup OpenHarmony SDK (Windows)
        if: runner.os == 'Windows'
        uses: openharmony-rs/setup-ohos-sdk@v1
        with:
          version: '5.0.0'
          components: 'all'

      - name: Locate hdc.exe (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          HDC=$(find "${HOME}/setup-ohos-sdk" "${OHOS_BASE_SDK_HOME:-/nonexistent}" -name "hdc.exe" -type f 2>/dev/null | head -1)
          [ -z "$HDC" ] && { echo "::error::hdc.exe not found"; exit 1; }
          cp "$HDC" "${GITHUB_WORKSPACE}/hdc.exe"
          ls -lh "${GITHUB_WORKSPACE}/hdc.exe"

      # --------- macOS: download both arch's SDK, lipo-merge into universal hdc ---------
      - name: Cache macOS OpenHarmony SDKs (both arch)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/ohos-mac-sdks
          key: ohos-mac-sdks-v5.0.0-universal-v2

      - name: Download macOS SDKs (ARM + Intel) and lipo-merge hdc
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          CACHE="$HOME/ohos-mac-sdks"
          mkdir -p "$CACHE/arm64" "$CACHE/x86_64"

          # ARM Mac SDK
          if [ ! -f "$CACHE/arm64/hdc" ]; then
            echo "Downloading ARM Mac SDK…"
            gh release download v5.0.0 --pattern 'L2-SDK-MAC-M1-PUBLIC.tar.gz' \
              --repo openharmony-rs/ohos-sdk --dir "$CACHE/arm64"
            tar -xzf "$CACHE/arm64/L2-SDK-MAC-M1-PUBLIC.tar.gz" -C "$CACHE/arm64"
            rm "$CACHE/arm64/L2-SDK-MAC-M1-PUBLIC.tar.gz"
            ARM_HDC=$(find "$CACHE/arm64" -name "hdc" -type f -perm +111 2>/dev/null | head -1)
            cp "$ARM_HDC" "$CACHE/arm64/hdc"
            # 清理大文件，只留 hdc 本身（cache 体积爆炸的话）
            find "$CACHE/arm64" -mindepth 1 -maxdepth 2 -not -name "hdc" -exec rm -rf {} + 2>/dev/null || true
          fi

          # Intel Mac SDK
          if [ ! -f "$CACHE/x86_64/hdc" ]; then
            echo "Downloading Intel Mac SDK…"
            gh release download v5.0.0 --pattern 'ohos-sdk-mac-public.tar.gz' \
              --repo openharmony-rs/ohos-sdk --dir "$CACHE/x86_64"
            tar -xzf "$CACHE/x86_64/ohos-sdk-mac-public.tar.gz" -C "$CACHE/x86_64"
            rm "$CACHE/x86_64/ohos-sdk-mac-public.tar.gz"
            X86_HDC=$(find "$CACHE/x86_64" -name "hdc" -type f -perm +111 2>/dev/null | head -1)
            cp "$X86_HDC" "$CACHE/x86_64/hdc"
            find "$CACHE/x86_64" -mindepth 1 -maxdepth 2 -not -name "hdc" -exec rm -rf {} + 2>/dev/null || true
          fi

          file "$CACHE/arm64/hdc"
          file "$CACHE/x86_64/hdc"

          # lipo 合并成 universal2 hdc
          lipo -create -output "${GITHUB_WORKSPACE}/hdc" \
            "$CACHE/arm64/hdc" "$CACHE/x86_64/hdc"
          chmod +x "${GITHUB_WORKSPACE}/hdc"

          echo "=== merged hdc ==="
          file "${GITHUB_WORKSPACE}/hdc"
          lipo -info "${GITHUB_WORKSPACE}/hdc"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python is universal2 (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          PY="$(which python3)"
          file "$PY"
          # actions/setup-python 在 macOS 上从 3.11 起装 universal2 build
          lipo -info "$PY" || true

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --onefile --windowed \
            --add-binary "hdc.exe;." \
            --name "HarmonyUDID" main.py
          ls -la dist/

      - name: Build Universal2 (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          pyinstaller --onefile --windowed \
            --target-arch universal2 \
            --add-binary "hdc:." \
            --name "HarmonyUDID" main.py
          ls -la dist/
          echo "=== built binary arch ==="
          BIN="dist/HarmonyUDID.app/Contents/MacOS/HarmonyUDID"
          file "$BIN"
          lipo -info "$BIN"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: bash
        run: mv dist/HarmonyUDID.exe "dist/HarmonyUDID-${{ matrix.label }}.exe"

      - name: Codesign + zip (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --force --deep --sign - dist/HarmonyUDID.app
          cd dist
          ditto -c -k --sequesterRsrc --keepParent HarmonyUDID.app "HarmonyUDID-${{ matrix.label }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HarmonyUDID-${{ matrix.label }}
          path: dist/HarmonyUDID-${{ matrix.label }}.*
          retention-days: 30

      - name: Add to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HarmonyUDID-${{ matrix.label }}.*
          generate_release_notes: true
          fail_on_unmatched_files: false
