name: Build Multi-Platform

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - '.github/workflows/build.yml'
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest        # Apple Silicon, output Universal2 .app
            label: macos-universal

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # --------- Windows: pick hdc.exe + libusb_shared.dll ---------
      - name: Setup OpenHarmony SDK (Windows)
        if: runner.os == 'Windows'
        uses: openharmony-rs/setup-ohos-sdk@v1
        with:
          version: '5.0.0'
          components: 'all'

      - name: Locate hdc.exe + libusb_shared.dll (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          HDC=$(find "${HOME}/setup-ohos-sdk" "${OHOS_BASE_SDK_HOME:-/nonexistent}" -name "hdc.exe" -type f 2>/dev/null | head -1)
          [ -z "$HDC" ] && { echo "::error::hdc.exe not found"; exit 1; }
          HDC_DIR=$(dirname "$HDC")
          cp "$HDC" "${GITHUB_WORKSPACE}/hdc.exe"

          # hdc.exe 依赖 libusb_shared.dll (在 toolchains 同目录)
          LIBUSB=$(find "$HDC_DIR" -maxdepth 2 -name "libusb_shared.dll" -type f 2>/dev/null | head -1)
          if [ -z "$LIBUSB" ]; then
            echo "::error::libusb_shared.dll not found next to hdc.exe"
            find "${HOME}/setup-ohos-sdk" -name "libusb_shared*" 2>/dev/null | head -10
            exit 1
          fi
          cp "$LIBUSB" "${GITHUB_WORKSPACE}/libusb_shared.dll"
          ls -lh "${GITHUB_WORKSPACE}/hdc.exe" "${GITHUB_WORKSPACE}/libusb_shared.dll"

      # --------- macOS: pull both arch's hdc+libusb, lipo into universal binaries ---------
      - name: Cache macOS OpenHarmony SDK binaries
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/ohos-mac-sdks
          # v3: 现在 cache 同时包含 hdc 和 libusb_shared.dylib
          key: ohos-mac-sdks-v5.0.0-universal-v3

      - name: Download macOS SDKs and lipo-merge hdc + libusb (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          CACHE="$HOME/ohos-mac-sdks"
          mkdir -p "$CACHE/arm64" "$CACHE/x86_64"

          # 提取一对二进制：hdc + libusb_shared.dylib
          extract_pair() {
            local ARCHIVE="$1" WORK="$2" OUT_HDC="$3" OUT_LIBUSB="$4"

            echo "::group::Extract $ARCHIVE"
            tar -xzf "$ARCHIVE" -C "$WORK"
            rm "$ARCHIVE"

            # 双层结构：tar.gz → *-Release.zip 内层
            for Z in $(find "$WORK" -name "*.zip" 2>/dev/null); do
              if [[ "$Z" == *toolchains* ]]; then
                echo "Unzipping $Z"
                unzip -q -o "$Z" -d "$WORK/_extracted"
              fi
            done
            echo "::endgroup::"

            # 找 Mach-O hdc
            local HDC=""
            for CAND in $(find "$WORK" -name "hdc" -type f 2>/dev/null); do
              if file "$CAND" | grep -q "Mach-O.*executable"; then
                HDC="$CAND"; break
              fi
            done
            if [ -z "$HDC" ]; then
              echo "::error::Mach-O hdc not found"
              find "$WORK" -name "hdc*" -type f | head -20
              return 1
            fi
            cp "$HDC" "$OUT_HDC"
            chmod +x "$OUT_HDC"

            # 找 libusb_shared.dylib（hdc 依赖 @rpath/libusb_shared.dylib，@rpath=@loader_path）
            local LIBUSB=$(find "$WORK" -name "libusb_shared.dylib" -type f 2>/dev/null | head -1)
            if [ -z "$LIBUSB" ]; then
              echo "::error::libusb_shared.dylib not found"
              find "$WORK" -name "*.dylib" -type f | head -20
              return 1
            fi
            cp "$LIBUSB" "$OUT_LIBUSB"

            echo "Got hdc: $(file "$OUT_HDC")"
            echo "Got libusb: $(file "$OUT_LIBUSB")"

            # cache 减肥：只保留 hdc + libusb
            find "$WORK" -mindepth 1 -not -name "hdc" -not -name "libusb_shared.dylib" \
              -exec rm -rf {} + 2>/dev/null || true
          }

          if [ ! -f "$CACHE/arm64/hdc" ] || [ ! -f "$CACHE/arm64/libusb_shared.dylib" ]; then
            echo "::group::Download ARM Mac SDK"
            gh release download v5.0.0 --pattern 'L2-SDK-MAC-M1-PUBLIC.tar.gz' \
              --repo openharmony-rs/ohos-sdk --dir "$CACHE/arm64"
            echo "::endgroup::"
            extract_pair "$CACHE/arm64/L2-SDK-MAC-M1-PUBLIC.tar.gz" "$CACHE/arm64" \
              "$CACHE/arm64/hdc" "$CACHE/arm64/libusb_shared.dylib"
          fi

          if [ ! -f "$CACHE/x86_64/hdc" ] || [ ! -f "$CACHE/x86_64/libusb_shared.dylib" ]; then
            echo "::group::Download Intel Mac SDK"
            gh release download v5.0.0 --pattern 'ohos-sdk-mac-public.tar.gz' \
              --repo openharmony-rs/ohos-sdk --dir "$CACHE/x86_64"
            echo "::endgroup::"
            extract_pair "$CACHE/x86_64/ohos-sdk-mac-public.tar.gz" "$CACHE/x86_64" \
              "$CACHE/x86_64/hdc" "$CACHE/x86_64/libusb_shared.dylib"
          fi

          # lipo 合并成 universal2
          lipo -create -output "${GITHUB_WORKSPACE}/hdc" \
            "$CACHE/arm64/hdc" "$CACHE/x86_64/hdc"
          chmod +x "${GITHUB_WORKSPACE}/hdc"

          lipo -create -output "${GITHUB_WORKSPACE}/libusb_shared.dylib" \
            "$CACHE/arm64/libusb_shared.dylib" "$CACHE/x86_64/libusb_shared.dylib"

          echo "=== merged hdc ==="
          file "${GITHUB_WORKSPACE}/hdc"
          lipo -info "${GITHUB_WORKSPACE}/hdc"
          echo "=== merged libusb_shared.dylib ==="
          file "${GITHUB_WORKSPACE}/libusb_shared.dylib"
          lipo -info "${GITHUB_WORKSPACE}/libusb_shared.dylib"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python is universal2 (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          PY="$(which python3)"
          file "$PY"
          lipo -info "$PY" || true

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --onefile --windowed \
            --add-binary "hdc.exe;." \
            --add-binary "libusb_shared.dll;." \
            --name "HarmonyUDID" main.py
          ls -la dist/

      - name: Build Universal2 (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          pyinstaller --onefile --windowed \
            --target-arch universal2 \
            --add-binary "hdc:." \
            --add-binary "libusb_shared.dylib:." \
            --name "HarmonyUDID" main.py
          ls -la dist/
          BIN="dist/HarmonyUDID.app/Contents/MacOS/HarmonyUDID"
          file "$BIN"
          lipo -info "$BIN"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: bash
        run: mv dist/HarmonyUDID.exe "dist/HarmonyUDID-${{ matrix.label }}.exe"

      - name: Codesign + zip (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --force --deep --sign - dist/HarmonyUDID.app
          cd dist
          ditto -c -k --sequesterRsrc --keepParent HarmonyUDID.app "HarmonyUDID-${{ matrix.label }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HarmonyUDID-${{ matrix.label }}
          path: dist/HarmonyUDID-${{ matrix.label }}.*
          retention-days: 30

      - name: Add to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HarmonyUDID-${{ matrix.label }}.*
          generate_release_notes: true
          fail_on_unmatched_files: false
